<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Form Validation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        form {
            width: 600px;
            padding: 20px;
        }

        form div {
            margin: 10px;
        }

        label {
            display: block;
        }
    </style>
</head>
<main>
     <section id="tentang">
            <h2>Bukan Saya</h2>

            <img
                src="https://img.pikbest.com/wp/202405/cartoon-humor-humorous-3d-gorilla-giving-a-thumbs-up_9831128.jpg!w700wp"
                alt="Ilustrasi gorila mengacungkan jempol">

        </section>
</main>
<body>
    <h1>Form validation</h1>
    <form action=""method="post">
        <div>
            <label for="nama">Masukkan Nama:</label>
            <input type="text" name="nama" id="nama">
        </div>

        <div>
            <label for="email">Masukkan E-mail:</label>
            <input type="email" name="email" id="email">
        </div>

        <div>
            <label for="nohp">Masukkan No Hp:</label>
            <input type="tel" name="nohp" id="nohp">
        </div>

        <div>
            <label for="website">Masukkan Website:</label>
            <input type="url" name="website" id="website">
        </div>

        <div>
            <label for="angka">Masukkan Angka:</label>
            <input type="number" name="angka" id="angka">
        </div>
        
        <div>
            <label for="tanggal">Masukkan Tanggal:</label>
            <input type="date" name="tanggal" id="tanggal">
        </div>
        
        <div>
            <label for="jam">Pilih Jam:</label>
            <input type="time" name="jam" id="jam">
        </div>
        
        <div>
            <label for="warna">Pilih Warna:</label>
            <input type="color" name="warna" id="warna">
        </div>

        <div>
            <button type="submit">Kirim</button>
        </div>
    </form>
</body>
</html>
